<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History | Freedom Swap by Greatiby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/global_freedom_styles.css">
<style>
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 20px 0;
}
.card {
  width: 100%;
  max-width: 540px;
  background: #fff;
  border-radius: 28px;
  padding: 22px 16px 16px;
}
small.k {
  display: block;
  font-size: 10px;
  color: #7B87A8;
}
.wrap {
  width: 100%;
  max-width: 540px;
}
.card {
  padding: 16px;
}
.card {
  padding: 28px 16px 16px;
}
.sh h1 {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.x {
  font-size: 17px;
  color: #111;
}
.card {
  padding: 18px 16px 22px;
  min-height: 268px;
}
.sh h1 {
  font-size: 18px;
}
.coin {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  flex: none;
}
.ht {
  font-size: 11px;
  font-weight: 700;
  margin: 0 2px;
}
.srch {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  margin: 14px 0 16px;
  padding: 0 14px;
  border: 1px solid #EEEFF2;
  border-radius: 999px;
  background: #fff;
  color: #7B87A8;
  transition: border-color .2s;
}
.srch:focus-within {
  border-color: var(--g);
}
.srch i {
  font-size: 10px;
}
.srch input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 10px;
}
.srch input::placeholder {
  color: #7B87A8;
}
.dt {
  font-size: 9px;
  color: #7B87A8;
  margin: 12px 2px 6px;
}
.tx {
  display: block;
  border: 1px solid #EEEFF2;
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
  background: #fff;
  transition: border-color .2s;
}
.tx:hover {
  border-color: var(--g);
}
.tx .t {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
}
.tx .t span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tx .t span:last-child {
  justify-self: end;
}
.tx .ar {
  color: #7B87A8;
  font-size: 9px;
}
.tx .b {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  font-size: 8px;
}
.sc {
  font-size: 8px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 6px;
}
.sc.w {
  color: #E58A00;
  background: #FFF4E0;
}
.sc.c {
  color: #16A34A;
  background: #E6F8EE;
}
.sc.r {
  color: #E5533D;
  background: #FDECEA;
}
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 36px 0 18px;
}
.ill {
  position: relative;
  width: 96px;
  height: 84px;
  margin-bottom: 14px;
}
.ill .f {
  font-size: 72px;
  color: #E5E7EB;
}
.ill .m {
  position: absolute;
  right: 6px;
  bottom: 2px;
  font-size: 34px;
  color: var(--gd);
}
.empty b {
  font-size: 11px;
}
.empty span {
  font-size: 9px;
  color: #5C6B8A;
  max-width: 130px;
  margin-top: 4px;
}
.dock {
  position: sticky;
  bottom: 24px;
  margin: 24px auto 24px;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 10px 16px 8px;
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 8px 28px rgba(15,23,42,.1);
  z-index: 5;
}
.dock a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 62px;
  font-size: 10px;
  color: var(--m);
}
.dock a i {
  font-size: 15px;
  color: #4b5563;
}
.dock a.on {
  color: #0B0B0B;
  font-weight: 500;
}
@media (max-width: 768px) {
  header {
    top: calc(10vh - 58px);
    margin: 16px 16px 0;
  }
  .nav-pill .logo .logo-text {
    font-size: 18px;
  }
  .nav-pill .logo .logo-mark {
    width: 22px;
    height: 22px;
    font-size: 10px;
  }
  .stage {
    padding: 22px 14px 0;
  }
  .card {
    background: none;
    padding: 0;
    border-radius: 0;
  }
  small.k {
    font-size: 8px;
  }
  .card {
    padding: 0;
  }
  .card {
    padding: 0;
  }
  .sh {
    margin: 0 2px 12px;
  }
  .sh h1 {
    font-size: 14px;
    gap: 8px;
  }
  .x {
    display: none;
  }
  .sh {
    display: none;
  }
  .stage {
    padding: 20px 14px 28px;
  }
  .is-empty .stage {
    background: #fff;
    border-radius: 0;
    margin-top: 0;
    padding-bottom: 40px;
  }
  .card {
    padding: 0;
    min-height: 0;
    background: none;
  }
  .coin {
    width: 14px;
    height: 14px;
    font-size: 8px;
  }
  .srch {
    margin: 12px 0 14px;
  }
  .tx {
    border: 0;
    padding: 10px 12px;
  }
  .empty {
    padding: 44px 0 10px;
  }
  .dock {
    display: none;
  }
}
</style>
</head>
<body class="flow">
<header>
  <div class="nav-pill">
    <img src="../assets/gtb_logo_dark.png" alt="logo">
    <nav class="main-nav">
      <a href="swap.html">Exchange</a>
      <a href="history.html">History</a>
      <a href="#">Support</a></nav>
  </div>
  <div class="header-cta">
    <a href="../index.html" class="btn btn-primary">Go Back Home</a>
    <button class="hamburger" onclick="openMenu()">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>
<div class="menu-overlay" id="overlay" onclick="closeMenu()"></div>
<aside class="mobile-menu" id="mobileMenu">
  <button class="mobile-close" onclick="closeMenu()">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <a href="swap.html">Exchange</a>
  <a href="history.html">History</a>
  <a href="#">Support</a>
  <a href="freedom_swap.html" class="btn btn-primary">Go Back Home</a>
</aside>
<main class="stage">
  <div class="wrap">
    <div class="sh">
      <h1>History</h1>
      <a class="x" href="swap.html">
        <i class="fa-regular fa-circle-xmark"></i>
      </a>
    </div>
    <section class="card">
      <h2 class="ht">Exchange History</h2>
      <label class="srch"><i class="fa-solid fa-magnifying-glass">
        </i><input id="q" type="search" autocomplete="off" placeholder="Search Exchange ID">
      </label>
      <h3 class="ht" id="all">All Transactions</h3>
      <div id="list"></div>
    </section>
  </div>
  <nav class="dock">
    <a href="swap.html">
      <i class="fa-solid fa-coins"></i>Coin
    </a>
    <a href="history.html" class="on">
      <i class="fa-regular fa-file-lines"></i>History
    </a>
    <a href="swap.html" class="mid">
      <i class="fa-solid fa-arrow-right-arrow-left" style="transform:rotate(90deg); color: white;"></i>
    </a>
    <a href="#">
      <i class="fa-solid fa-headset"></i>Support
    </a>
    <a href="../index.html">
      <i class="fa-solid fa-globe"></i>Greatiby
    </a>
  </nav>
</main>

<footer class="site-footer">
  <div class="footer-top">
    <a class="logo light" href="#">
      <img src="../assets/gtb_logo_light.png" alt="logo">
    </a>
    <nav class="footer-links">
      <a href="../legal/legal.html#terms-of-service">Terms</a>
      <a href="../legal/legal.html#privacy-policy">Privacy</a>
      <a href="../legal/legal.html#kyc-aml">AML</a>
    </nav>
  </div>
  <p class="copy">
    &copy; 2026 Greatiby Digital Assets Exchange<span class="dash"> - </span><br class="mob-only">RC-1581814. All rights reserved.
  </p>
</footer>

<script>
const $=id=>document.getElementById(id);
const C={BTC:{c:'#F7931A',i:'fa-brands fa-bitcoin'},ETH:{c:'#1C1F3A',i:'fa-brands fa-ethereum'},USDT:{c:'#26A17B',i:'fa-solid fa-dollar-sign'},SOL:{c:'#8247E5',i:'fa-solid fa-s'},BNB:{c:'#F3BA2F',i:'fa-solid fa-b'}};
const coin=k=>`<span class="coin" style="--c:${(C[k]||C.BTC).c}"><i class="${(C[k]||C.BTC).i}"></i></span>`;
const ID='QVroof78ur77',row=(d,s)=>({id:ID,from:'BTC',to:'ETH',amt:'0.12567',out:'3.39752',d,s});
const DEMO=[row('Mar. 10, 2026','Waiting'),row('Mar. 10, 2026','Completed'),row('Mar. 9, 2026','Completed'),row('Mar. 9, 2026','Refunded')];
let data=[];
try{data=JSON.parse(localStorage.getItem('greatibyHistory')||'[]')}catch(e){}
if(new URLSearchParams(location.search).has('demo'))data=DEMO; // preview of the filled design
document.body.classList.toggle('is-empty',!data.length);
const cls={Waiting:'w',Completed:'c',Refunded:'r'};
function render(){
  const f=$('q').value.trim().toLowerCase(),L=$('list');
  const rows=data.filter(x=>x.id.toLowerCase().includes(f));
  $('all').style.display=data.length?'':'none';
  if(!rows.length){
    L.innerHTML=`<div class="empty"><div class="ill"><i class="fa-regular fa-file-lines f"></i><i class="fa-solid fa-magnifying-glass m"></i></div><b>${data.length?'No match found!':'No transaction yet!'}</b><span>${data.length?'Try a different Exchange ID':'All your exchange history will appear here'}</span></div>`;
    return;
  }
  let last='',h='';
  rows.forEach(x=>{
    if(x.d!==last){h+=`<p class="dt">${x.d}</p>`;last=x.d}
    const p=new URLSearchParams({from:x.from,to:x.to,amt:x.amt,out:x.out,order:x.id,date:x.d});
    h+=`<a class="tx" href="receipt.html?${p}"><div class="t"><span>${coin(x.from)}${x.amt} ${x.from}</span><i class="fa-solid fa-arrow-right-long ar"></i><span>${coin(x.to)}${x.out} ${x.to}</span></div><div class="b"><span>ID: ${x.id}</span><span class="sc ${cls[x.s]||'w'}">${x.s}</span></div></a>`;
  });
  L.innerHTML=h;
}
$('q').addEventListener('input',render);
render();
function openMenu(){$('mobileMenu').classList.add('open');$('overlay').classList.add('open')}
function closeMenu(){$('mobileMenu').classList.remove('open');$('overlay').classList.remove('open')}
</script>
</body>
</html>
